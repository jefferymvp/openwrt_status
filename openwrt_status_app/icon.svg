<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="argon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e72e4"/>
      <stop offset="50%" stop-color="#825ee4"/>
      <stop offset="100%" stop-color="#11cdef"/>
    </linearGradient>
    <linearGradient id="metal-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded App Icon -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#argon-bg)" filter="url(#drop-shadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#metal-glow)" stroke-width="4"/>

  <!-- Router Base / Icon Graphic -->
  <g fill="#ffffff" transform="translate(0, 10)">
    <!-- Antennas -->
    <rect x="130" y="140" width="16" height="120" rx="8" opacity="0.9"/>
    <rect x="248" y="110" width="16" height="150" rx="8" opacity="0.95"/>
    <rect x="366" y="140" width="16" height="120" rx="8" opacity="0.9"/>

    <!-- Signal Pulse Waves -->
    <path d="M190,170 A70,70 0 0,1 322,170" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    <path d="M150,130 A120,120 0 0,1 362,130" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.4"/>

    <!-- Router Main Chassis -->
    <rect x="100" y="250" width="312" height="110" rx="24" fill="#14172b" opacity="0.92"/>
    <rect x="100" y="250" width="312" height="110" rx="24" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3"/>

    <!-- Status Indicator LEDs -->
    <circle cx="150" cy="305" r="10" fill="#2dce89"/>
    <circle cx="195" cy="305" r="10" fill="#11cdef"/>
    <circle cx="240" cy="305" r="10" fill="#2dce89"/>
    <circle cx="285" cy="305" r="10" fill="#5e72e4"/>
    <circle cx="330" cy="305" r="10" fill="#2dce89"/>
    <circle cx="365" cy="305" r="6" fill="#fb6340"/>
  </g>
</svg>
