[package]
name = "openwrt_status"
version = "1.1.0"
edition = "2021"
authors = ["jefferymvp"]
description = "Lightweight OpenWrt System Status API Backend written in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[profile.release]
opt-level = "z"     # 体积优化
lto = true          # 链接时全局优化
codegen-units = 1   # 提高优化程度
panic = "abort"     # 移除展开代码以缩减体积
strip = true        # 自动剥离符号表
