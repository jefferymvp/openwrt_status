name: Build & Release OpenWrt Status (Rust)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 软路由
          - target: x86_64-unknown-linux-musl
            artifact_name: openwrt-status-x86_64-musl
          # x86 32位软路由
          - target: i686-unknown-linux-musl
            artifact_name: openwrt-status-i686-musl
          # ARM64 (NanoPi R2S/R4S/R5S/R6S, 树莓派 4/5, RK3568 等)
          - target: aarch64-unknown-linux-musl
            artifact_name: openwrt-status-aarch64-musl
          # ARMv7 (斐讯 K3, 华硕 AC86U, IPQ40xx 等)
          - target: armv7-unknown-linux-musleabihf
            artifact_name: openwrt-status-armv7-musleabihf

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build with Cross
        run: |
          cross build --release --target ${{ matrix.target }}

          # 准备发布归档目录
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/openwrt_status dist/${{ matrix.artifact_name }}/openwrt-status
          chmod +x dist/${{ matrix.artifact_name }}/openwrt-status

          # 将 OpenWrt 服务脚本一并打包放入压缩包 (避免同名覆盖二进制)
          cp etc/init.d/openwrt-status dist/${{ matrix.artifact_name }}/openwrt-status.init
          chmod +x dist/${{ matrix.artifact_name }}/openwrt-status.init

          # 打包为 .tar.gz
          cd dist
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C ${{ matrix.artifact_name }} .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p openwrt_status_app/android/app/src/main/assets
          cp openwrt_status_app/index.html openwrt_status_app/android/app/src/main/assets/
          cp openwrt_status_app/style.css openwrt_status_app/android/app/src/main/assets/
          cp openwrt_status_app/app.js openwrt_status_app/android/app/src/main/assets/
          cp openwrt_status_app/manifest.json openwrt_status_app/android/app/src/main/assets/
          cp openwrt_status_app/icon.svg openwrt_status_app/android/app/src/main/assets/

      - name: Build Android APK
        working-directory: openwrt_status_app/android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/*.apk ../../dist/openwrt-status-app.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-status-app-apk
          path: dist/openwrt-status-app.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets and Checksums
        run: |
          mkdir -p release-files
          find release-artifacts \( -name "*.tar.gz" -o -name "*.apk" \) -exec mv {} release-files/ \;
          cd release-files
          sha256sum * > sha256sums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
