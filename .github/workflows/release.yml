name: Build & Release OpenWrt Status

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # x86_64 软路由
          - goos: linux
            goarch: amd64
            goarm: ''
            gomips: ''
            artifact_name: openwrt-status-linux-amd64
          # x86 32位软路由
          - goos: linux
            goarch: 386
            goarm: ''
            gomips: ''
            artifact_name: openwrt-status-linux-386
          # ARM64 (NanoPi R2S/R4S/R5S/R6S, 树莓派 4/5, RK3568 等)
          - goos: linux
            goarch: arm64
            goarm: ''
            gomips: ''
            artifact_name: openwrt-status-linux-arm64
          # ARMv7 (斐讯 K3, 华硕 AC86U, IPQ40xx 等)
          - goos: linux
            goarch: arm
            goarm: '7'
            gomips: ''
            artifact_name: openwrt-status-linux-armv7
          # ARMv5 (老旧 ARM 路由)
          - goos: linux
            goarch: arm
            goarm: '5'
            gomips: ''
            artifact_name: openwrt-status-linux-armv5
          # MIPS Little Endian 软浮点 (MT7621, MT7620, K2P, 新路由3 等最普遍的硬路由)
          - goos: linux
            goarch: mipsle
            goarm: ''
            gomips: 'softfloat'
            artifact_name: openwrt-status-linux-mipsle-softfloat
          # MIPS Big Endian 软浮点 (Atheros AR71xx, AR93xx 等大端平台)
          - goos: linux
            goarch: mips
            goarm: ''
            gomips: 'softfloat'
            artifact_name: openwrt-status-linux-mips-softfloat

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Determine Version
        id: vars
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          go build -trimpath -ldflags="-s -w \
            -X 'main.Version=${{ steps.vars.outputs.version }}' \
            -X 'main.GitCommit=${{ github.sha }}' \
            -X 'main.BuildTime=${{ steps.vars.outputs.build_time }}'" \
            -o dist/${{ matrix.artifact_name }}/openwrt-status ./cmd/server

          # 将 OpenWrt 服务脚本一并打包放入压缩包
          cp etc/init.d/openwrt-status dist/${{ matrix.artifact_name }}/
          chmod +x dist/${{ matrix.artifact_name }}/openwrt-status

          # 打包为 .tar.gz
          cd dist
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C ${{ matrix.artifact_name }} .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets and Checksums
        run: |
          mkdir -p release-files
          # 将解压出来的 tar.gz 移动到 release-files 目录
          find release-artifacts -name "*.tar.gz" -exec mv {} release-files/ \;
          cd release-files
          sha256sum *.tar.gz > sha256sums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
